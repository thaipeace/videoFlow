name: Automated Daily News Broadcast Pipeline

on:
  schedule:
    # 06:03 VN (UTC+7) = 23:03 UTC (ngày hôm trước) -> Tin Mới (Thế giới + Chiến sự + Thể thao 16:9)
    - cron: '3 23 * * *'
    # 12:03 VN (UTC+7) = 05:03 UTC -> Shorts Tin Vui (9:16)
    - cron: '3 5 * * *'
    # 17:33 VN (UTC+7) = 10:33 UTC -> Shorts Tin AI Nổi Bật (9:16)
    - cron: '33 10 * * *'
    # Shorts Tin Độc Lạ (viral) đang TẠM TẮT cho đến khi có cách làm chất lượng hơn.
  workflow_dispatch:
    inputs:
      category:
        description: 'Chủ đề bản tin'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'tin_moi'
          - 'hope'
          - 'ai'
          - 'tin_nong'
      upload_youtube:
        description: 'Tự động đăng tải lên YouTube'
        required: true
        default: true
        type: boolean
      youtube_privacy:
        description: 'Chế độ hiển thị YouTube (private: riêng tư, unlisted: không công khai, public: công khai)'
        required: true
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'unlisted'
          - 'public'
      quick_test:
        description: 'Chế độ test nhanh (Mock data xuất video trong vài giây)'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-news-broadcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    name: Produce & Publish News Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Log Trigger Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Cron fired: ${{ github.event.schedule }}"
          echo "Runner UTC:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Runner VN:    $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pydub srt edge-tts numpy pydantic python-dotenv

      - name: Restore Published News History Cache
        uses: actions/cache/restore@v4
        with:
          path: runtime/data/daily_news/published_news_history.json
          key: daily-news-history-${{ github.run_id }}
          restore-keys: |
            daily-news-history-

      - name: Run Automated News Pipeline
        env:
          PYTHONPATH: src:.
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          INPUT_CAT="${{ github.event.inputs.category || 'auto' }}"
          # Scheduled runs: pick category from the cron that fired (immune to GitHub start delays)
          case "$EVENT_SCHEDULE" in
            '3 23 * * *')  INPUT_CAT="tin_moi" ;;
            '3 5 * * *')   INPUT_CAT="hope" ;;
            '33 10 * * *') INPUT_CAT="ai" ;;
          esac
          echo "Resolved category: $INPUT_CAT"
          YT_FLAG=""
          if [ "${{ github.event.inputs.upload_youtube }}" = "false" ]; then
            YT_FLAG="--no-youtube"
          else
            YT_FLAG="--youtube"
          fi
          
          TEST_FLAG=""
          if [ "${{ github.event.inputs.quick_test }}" = "true" ]; then
            TEST_FLAG="--quick-test"
          fi
          
          PRIV_FLAG="--privacy ${{ github.event.inputs.youtube_privacy || 'private' }}"
          
          python scripts/ci_run_daily_news.py \
            --category "$INPUT_CAT" \
            $YT_FLAG \
            $PRIV_FLAG \
            $TEST_FLAG

      - name: Save Published News History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime/data/daily_news/published_news_history.json
          key: daily-news-history-${{ github.run_id }}

      - name: Commit and Push Updated News History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f runtime/data/daily_news/published_news_history.json || true
          if git diff --staged --quiet; then
            echo "No changes in published news history."
          else
            git commit -m "chore(daily-news): update published news history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped or failed"
          fi

      - name: Upload Editorial Scripts to Google Drive
        if: always()
        env:
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbzVrVvGB0HAFhO9GgH-g5EP_iPfoFjZlNdhX_tXhvu-bfeznog8WabsX8nYj2SwbvOd/exec' }}
        run: |
          python scripts/upload_to_gdrive.py --dir runtime/data/editorial_scripts --limit 1 || true

      - name: Upload Logs & Social Publish Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-run-artifacts
          path: |
            runtime/daily_news/
            runtime/data/social_publish_manifest.json
            runtime/data/daily_news_settings.json
            runtime/data/daily_news/published_news_history.json
            runtime/data/editorial_scripts/
          retention-days: 3
          if-no-files-found: ignore
