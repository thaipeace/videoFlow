name: Automated Daily News Broadcast Pipeline

on:
  schedule:
    # Đặt sớm hơn 3 tiếng để bù trừ độ trễ hàng đợi GitHub Actions (~3h):
    # 1. Bản tin Tin Nóng (16:9): Mục tiêu ~06:00 VN -> kích hoạt lúc 03:03 VN (20:03 UTC ngày hôm trước)
    - cron: '3 20 * * *'
    # 2. Shorts Tin Vui (9:16): Mục tiêu ~12:00 VN -> kích hoạt lúc 09:03 VN (02:03 UTC)
    - cron: '3 2 * * *'
    # 3. Shorts Tin AI (9:16): Mục tiêu ~17:30 VN -> kích hoạt lúc 14:33 VN (07:33 UTC)
    - cron: '33 7 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Chủ đề bản tin (1 Bản tin 16:9 + 2 Shorts 9:16)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'tin_moi'
          - 'hope'
          - 'ai'
      upload_youtube:
        description: 'Tự động đăng tải lên YouTube'
        required: true
        default: true
        type: boolean
      youtube_privacy:
        description: 'Chế độ hiển thị YouTube (private: riêng tư, unlisted: không công khai, public: công khai)'
        required: true
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'unlisted'
          - 'public'
      redo_last:
        description: 'Làm lại bản tin vừa chạy trước đó (Hoàn tác đợt tin gần nhất của chủ đề này khỏi lịch sử để không mất tin)'
        required: false
        default: false
        type: boolean
      quick_test:
        description: 'Chế độ test nhanh (Mock data xuất video trong vài giây)'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-news-broadcast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce-and-publish:
    name: Produce & Publish News Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Log Trigger Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Cron fired: ${{ github.event.schedule }}"
          echo "Runner UTC:   $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Runner VN:    $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute Base History Hash
        run: |
          BASE_HASH=$(sha256sum runtime/data/daily_news/published_news_history.json | cut -c1-12)
          echo "BASE_HISTORY_HASH=$BASE_HASH" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pydub srt edge-tts numpy pydantic python-dotenv

      - name: Restore Published News History Cache
        uses: actions/cache/restore@v4
        with:
          path: runtime/data/daily_news/published_news_history.json
          key: daily-news-history-v2-${{ env.BASE_HISTORY_HASH }}-${{ github.run_id }}
          restore-keys: |
            daily-news-history-v2-${{ env.BASE_HISTORY_HASH }}-

      - name: Run Automated News Pipeline
        env:
          PYTHONPATH: src:.
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          INPUT_CAT="${{ github.event.inputs.category || 'auto' }}"
          # Scheduled runs: pick category from the cron that fired (immune to GitHub start delays)
          case "$EVENT_SCHEDULE" in
            '3 20 * * *') INPUT_CAT="tin_moi" ;;
            '3 2 * * *')  INPUT_CAT="hope" ;;
            '33 7 * * *') INPUT_CAT="ai" ;;
          esac
          echo "Resolved category: $INPUT_CAT"
          YT_FLAG=""
          if [ "${{ github.event.inputs.upload_youtube }}" = "false" ]; then
            YT_FLAG="--no-youtube"
          else
            YT_FLAG="--youtube"
          fi
          
          TEST_FLAG=""
          if [ "${{ github.event.inputs.quick_test }}" = "true" ]; then
            TEST_FLAG="--quick-test"
          fi
          
          REDO_FLAG=""
          if [ "${{ github.event.inputs.redo_last }}" = "true" ]; then
            REDO_FLAG="--redo-last"
          fi
          
          PRIV_FLAG="--privacy ${{ github.event.inputs.youtube_privacy || 'private' }}"
          
          python scripts/ci_run_daily_news.py \
            --category "$INPUT_CAT" \
            $YT_FLAG \
            $PRIV_FLAG \
            $REDO_FLAG \
            $TEST_FLAG

      - name: Save Published News History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime/data/daily_news/published_news_history.json
          key: daily-news-history-v2-${{ env.BASE_HISTORY_HASH }}-${{ github.run_id }}

      - name: Upload Editorial Scripts to Google Drive
        if: always()
        env:
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbzVrVvGB0HAFhO9GgH-g5EP_iPfoFjZlNdhX_tXhvu-bfeznog8WabsX8nYj2SwbvOd/exec' }}
        run: |
          python scripts/upload_to_gdrive.py --dir runtime/data/editorial_scripts --limit 1 || true

      - name: Upload Logs & Social Publish Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-run-artifacts
          path: |
            runtime/daily_news/
            runtime/data/social_publish_manifest.json
            runtime/data/daily_news_settings.json
            runtime/data/daily_news/published_news_history.json
            runtime/data/editorial_scripts/
          retention-days: 3
          if-no-files-found: ignore
