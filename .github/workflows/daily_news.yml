name: Automated Daily News Broadcast Pipeline

on:
  schedule:
    # 05:30 VN (UTC+7) = 22:30 UTC previous day -> Tin Mới (Thế giới + Thể thao 16:9)
    - cron: '30 22 * * *'
    # 11:30 VN (UTC+7) = 04:30 UTC -> Shorts Tin Vui (9:16)
    - cron: '30 4 * * *'
    # 12:00 VN (UTC+7) = 05:00 UTC -> Shorts Tin Độc Lạ (9:16)
    - cron: '0 5 * * *'
    # 17:30 VN (UTC+7) = 10:30 UTC -> Tin Nóng (Chiến sự + Công nghệ 16:9)
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Chủ đề bản tin'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'tin_moi'
          - 'hope'
          - 'viral'
          - 'tin_nong'
      upload_youtube:
        description: 'Tự động đăng tải lên YouTube'
        required: true
        default: true
        type: boolean
      quick_test:
        description: 'Chế độ test nhanh (Mock data xuất video trong vài giây)'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-news-broadcast
  cancel-in-progress: false

jobs:
  produce-and-publish:
    name: Produce & Publish News Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pydub srt edge-tts

      - name: Run Automated News Pipeline
        env:
          PYTHONPATH: src:.
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          INPUT_CAT="${{ github.event.inputs.category || 'auto' }}"
          YT_FLAG=""
          if [ "${{ github.event.inputs.upload_youtube }}" = "false" ]; then
            YT_FLAG="--no-youtube"
          else
            YT_FLAG="--youtube"
          fi
          
          TEST_FLAG=""
          if [ "${{ github.event.inputs.quick_test }}" = "true" ]; then
            TEST_FLAG="--quick-test"
          fi
          
          python scripts/ci_run_daily_news.py \
            --category "$INPUT_CAT" \
            $YT_FLAG \
            $TEST_FLAG

      - name: Upload Editorial Scripts to Google Drive
        if: always()
        env:
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbzVrVvGB0HAFhO9GgH-g5EP_iPfoFjZlNdhX_tXhvu-bfeznog8WabsX8nYj2SwbvOd/exec' }}
        run: |
          python scripts/upload_to_gdrive.py --dir runtime/data/editorial_scripts --limit 5 || true

      - name: Upload Logs & Social Publish Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-run-artifacts
          path: |
            runtime/daily_news/
            runtime/data/social_publish_manifest.json
            runtime/data/daily_news_settings.json
            runtime/data/editorial_scripts/
          retention-days: 3
          if-no-files-found: ignore
